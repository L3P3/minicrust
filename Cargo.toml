[package]
name = "minicrust"
authors = ["L3P3 <dev@l3p3.de>"]
description = "cpu voxel raytracing in rust"
repository = "https://github.com/L3P3/minicrust"
version = "0.1.5"
edition = "2024"
license = "zlib"

[profile.release]
opt-level = "z"
lto = "fat"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
num-integer = "0.1.*"
rayon = "1.*"
softbuffer = { version = "0.4.*", default-features = false, features = ["x11", "x11-dlopen"] }
winit = { version = "0.30.*", default-features = false, features = ["rwh_06", "x11"] }
