name: Test
# Tests if the code compiles and passes the tests

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@master

      - name: Run tests
        run: cargo test --verbose
