name: Version Tag
# If the version in Cargo.toml is changed, this workflow will create a new tag

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-tag:
    runs-on: ubuntu-latest
    name: Create version tag
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Read version from Cargo.toml
        id: read-version
        run: node -e "process.stdout.write('version=' + require('fs').readFileSync('Cargo.toml','utf8').match(/^version\\s*=\\s*\"([^\"]+)\"/m)[1] + '\n')" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag --force "v${{ steps.read-version.outputs.version }}"
          git push --force --tags
